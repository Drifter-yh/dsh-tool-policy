name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts --config.minimumReleaseAge=0 --config.strictDepBuilds=false
      - run: node_modules/.bin/tsc --noEmit
      - run: node_modules/.bin/eslint .
      - run: node_modules/.bin/prettier --check .
      - run: node_modules/.bin/vitest run --config vitest.config.ts
      - run: node_modules/.bin/tsdown
      - run: node_modules/.bin/tsx demo/run-loader.ts
      - run: npm pack --dry-run
